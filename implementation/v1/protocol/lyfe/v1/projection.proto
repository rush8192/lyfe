syntax = "proto3";

package lyfe.v1;

option csharp_namespace = "Lyfe.Protocol.V1";

enum WorldLifecycle {
  WORLD_LIFECYCLE_UNSPECIFIED = 0;
  WORLD_LIFECYCLE_PAUSED_READY = 1;
}

enum OrganismLifecyclePhase {
  ORGANISM_LIFECYCLE_PHASE_UNSPECIFIED = 0;
  ORGANISM_LIFECYCLE_PHASE_MATURE = 1;
}

enum SpeciesPopulationScope {
  SPECIES_POPULATION_SCOPE_UNSPECIFIED = 0;
  SPECIES_POPULATION_SCOPE_WORLD_EXACT = 1;
  SPECIES_POPULATION_SCOPE_LIVE_TILES_OBSERVED = 2;
}

enum OrganismBehavior {
  ORGANISM_BEHAVIOR_UNSPECIFIED = 0;
  ORGANISM_BEHAVIOR_BASELINE = 1;
  ORGANISM_BEHAVIOR_CONSERVING = 2;
  ORGANISM_BEHAVIOR_FORAGING = 3;
  ORGANISM_BEHAVIOR_DISPERSING = 4;
  ORGANISM_BEHAVIOR_FLEEING = 5;
}

enum BehaviorTargetKind {
  BEHAVIOR_TARGET_KIND_UNSPECIFIED = 0;
  BEHAVIOR_TARGET_KIND_ORGANISM = 1;
  BEHAVIOR_TARGET_KIND_REMNANT = 2;
  BEHAVIOR_TARGET_KIND_EDGE = 3;
  BEHAVIOR_TARGET_KIND_LOCAL_POINT = 4;
}

enum GameMode {
  GAME_MODE_UNSPECIFIED = 0;
  GAME_MODE_FREE_SANDBOX = 1;
  GAME_MODE_SURVIVAL = 2;
}

enum GameRunStatus {
  GAME_RUN_STATUS_UNSPECIFIED = 0;
  GAME_RUN_STATUS_ACTIVE = 1;
  GAME_RUN_STATUS_LOST = 2;
}

enum GameLossReason {
  GAME_LOSS_REASON_UNSPECIFIED = 0;
  GAME_LOSS_REASON_ALL_LIFE_EXTINCT = 1;
  GAME_LOSS_REASON_CONTROLLED_SPECIES_EXTINCT = 2;
}

enum OrganismJourneyEventFamily {
  ORGANISM_JOURNEY_EVENT_FAMILY_UNSPECIFIED = 0;
  ORGANISM_JOURNEY_EVENT_FAMILY_BIRTH = 1;
  ORGANISM_JOURNEY_EVENT_FAMILY_REPRODUCTION = 2;
  ORGANISM_JOURNEY_EVENT_FAMILY_RESOURCE_ABSORPTION = 3;
  ORGANISM_JOURNEY_EVENT_FAMILY_FEEDING = 4;
  ORGANISM_JOURNEY_EVENT_FAMILY_MIGRATION = 5;
  ORGANISM_JOURNEY_EVENT_FAMILY_DEATH = 6;
  ORGANISM_JOURNEY_EVENT_FAMILY_STRESS = 7;
  ORGANISM_JOURNEY_EVENT_FAMILY_BEHAVIOR_TRANSITION = 8;
}

enum LineageReviewLandmarkKind {
  LINEAGE_REVIEW_LANDMARK_KIND_UNSPECIFIED = 0;
  LINEAGE_REVIEW_LANDMARK_KIND_COOLDOWN_BOUNDARY = 1;
  LINEAGE_REVIEW_LANDMARK_KIND_PROPOSAL_FOLLOW_UP = 2;
}

enum LineageReviewEvidenceKind {
  LINEAGE_REVIEW_EVIDENCE_KIND_UNSPECIFIED = 0;
  LINEAGE_REVIEW_EVIDENCE_KIND_GENERAL_OUTCOMES = 1;
  LINEAGE_REVIEW_EVIDENCE_KIND_CAPABILITY_ACTIVATION = 2;
  LINEAGE_REVIEW_EVIDENCE_KIND_CONDITION_AND_PRESSURE = 3;
  LINEAGE_REVIEW_EVIDENCE_KIND_GEOGRAPHIC_SPREAD = 4;
  LINEAGE_REVIEW_EVIDENCE_KIND_RESERVE_STORAGE = 5;
}

enum LineageReviewEvidenceReferenceKind {
  LINEAGE_REVIEW_EVIDENCE_REFERENCE_KIND_UNSPECIFIED = 0;
  LINEAGE_REVIEW_EVIDENCE_REFERENCE_KIND_SPECIATION_DECISION = 1;
  LINEAGE_REVIEW_EVIDENCE_REFERENCE_KIND_REVIEWED_SPECIES_SUMMARY = 2;
  LINEAGE_REVIEW_EVIDENCE_REFERENCE_KIND_COMPARISON_SPECIES_SUMMARY = 3;
  LINEAGE_REVIEW_EVIDENCE_REFERENCE_KIND_REVIEWED_JOURNEY_WINDOW = 4;
  LINEAGE_REVIEW_EVIDENCE_REFERENCE_KIND_LIVE_TILE_RESOURCE_WINDOW = 5;
}

enum LineageReviewCapabilityKind {
  LINEAGE_REVIEW_CAPABILITY_KIND_UNSPECIFIED = 0;
  LINEAGE_REVIEW_CAPABILITY_KIND_RESOURCE_CONSERVATION = 1;
}

enum NotableEventFamily {
  NOTABLE_EVENT_FAMILY_UNSPECIFIED = 0;
  NOTABLE_EVENT_FAMILY_SPECIATION = 1;
  NOTABLE_EVENT_FAMILY_FIRST_REPRODUCTION = 2;
  NOTABLE_EVENT_FAMILY_POPULATION_MILESTONE = 3;
  NOTABLE_EVENT_FAMILY_FIRST_TILE_OCCUPATION = 4;
  NOTABLE_EVENT_FAMILY_FIRST_REACTION_EXECUTION = 5;
  NOTABLE_EVENT_FAMILY_SPECIES_EXTINCTION = 6;
  NOTABLE_EVENT_FAMILY_POPULATION_DANGER_THRESHOLD = 7;
  NOTABLE_EVENT_FAMILY_POPULATION_DECLINE_THRESHOLD = 8;
  NOTABLE_EVENT_FAMILY_SUSTAINED_LOW_HEALTH = 9;
  NOTABLE_EVENT_FAMILY_REALIZED_DEATH_MECHANISM = 10;
  NOTABLE_EVENT_FAMILY_SUSTAINED_RESOURCE_PRESSURE = 11;
}

enum NotableEventSignificance {
  NOTABLE_EVENT_SIGNIFICANCE_UNSPECIFIED = 0;
  NOTABLE_EVENT_SIGNIFICANCE_INFORMATIONAL = 1;
  NOTABLE_EVENT_SIGNIFICANCE_STRATEGIC = 2;
  NOTABLE_EVENT_SIGNIFICANCE_CRITICAL = 3;
}

message NotableEvent {
  uint64 event_id = 1;
  NotableEventFamily family = 2;
  NotableEventSignificance significance = 3;
  uint32 significance_rule_version = 4;
  uint64 completed_tick = 5;
  uint64 simulated_hours = 6;
  uint64 species_id = 7;
  optional uint64 related_species_id = 8;
  optional uint32 tile_id = 9;
  optional uint32 reaction_id = 10;
  uint64 source_event_id = 11;
  uint64 milestone_value = 12;
  string deduplication_key = 13;
  uint64 baseline_value = 14;
}

enum AttentionAlertClass {
  ATTENTION_ALERT_CLASS_UNSPECIFIED = 0;
  ATTENTION_ALERT_CLASS_INFORMATIONAL = 1;
  ATTENTION_ALERT_CLASS_STRATEGIC = 2;
  ATTENTION_ALERT_CLASS_CRITICAL = 3;
}

enum AttentionAlertKind {
  ATTENTION_ALERT_KIND_UNSPECIFIED = 0;
  ATTENTION_ALERT_KIND_NOTABLE_EVENT_GROUP = 1;
  ATTENTION_ALERT_KIND_LINEAGE_REVIEW_BOUNDARY = 2;
}

message AttentionAlert {
  uint64 alert_id = 1;
  AttentionAlertClass alert_class = 2;
  AttentionAlertKind kind = 3;
  optional NotableEventFamily event_family = 4;
  uint64 completed_tick = 5;
  uint64 simulated_hours = 6;
  uint64 species_id = 7;
  repeated uint64 chronicle_event_ids = 8;
  string deduplication_key = 9;
}

message LineageReviewCapabilityActivation {
  LineageReviewCapabilityKind kind = 1;
  uint32 source_trait_id = 2;
  bool introduced_by_proposal = 3;
  bool installed = 4;
  uint64 activation_count = 5;
}

message LineageReviewReactionActivation {
  uint32 reaction_id = 1;
  bool introduced_by_proposal = 2;
  bool installed = 3;
  uint64 activation_count = 4;
}

message LineageReviewEvidenceReference {
  LineageReviewEvidenceReferenceKind kind = 1;
  optional uint64 species_id = 2;
  optional uint32 tile_id = 3;
  uint64 from_exclusive_tick = 4;
  uint64 through_completed_tick = 5;
}

message LineageReviewObservation {
  uint64 species_id = 1;
  SpeciesPopulationScope population_scope = 2;
  uint64 population = 3;
  uint32 average_health_q = 4;
  uint32 average_reserve_q = 5;
  uint32 occupied_tile_count = 6;
  bool activity_counts_available = 7;
  uint64 birth_count = 8;
  uint64 death_count = 9;
  uint64 migration_count = 10;
  uint32 average_resource_pressure_q = 11;
  uint32 average_acquisition_coverage_q = 12;
  repeated BehaviorCount behavior_counts = 13;
}

message LineageReviewLandmark {
  uint64 event_id = 1;
  LineageReviewLandmarkKind kind = 2;
  uint64 completed_tick = 3;
  uint64 simulated_hours = 4;
  uint64 window_hours = 5;
  uint64 speciation_event_id = 6;
  uint64 ancestor_species_id = 7;
  uint64 descendant_species_id = 8;
  uint64 perspective_species_id = 9;
  repeated uint32 trait_ids = 10;
  LineageReviewEvidenceKind evidence_kind = 11;
  LineageReviewObservation perspective_baseline = 12;
  LineageReviewObservation comparison_baseline = 13;
  LineageReviewObservation perspective_current = 14;
  LineageReviewObservation comparison_current = 15;
  repeated LineageReviewEvidenceReference evidence_references = 16;
  repeated LineageReviewCapabilityActivation capability_activations = 17;
  repeated LineageReviewReactionActivation reaction_activations = 18;
}

enum ResourceBiologicalForm {
  RESOURCE_BIOLOGICAL_FORM_UNSPECIFIED = 0;
  RESOURCE_BIOLOGICAL_FORM_INORGANIC = 1;
  RESOURCE_BIOLOGICAL_FORM_ORGANIC = 2;
  RESOURCE_BIOLOGICAL_FORM_BOUNDARY = 3;
}

enum ResourceEnvironmentalPhase {
  RESOURCE_ENVIRONMENTAL_PHASE_UNSPECIFIED = 0;
  RESOURCE_ENVIRONMENTAL_PHASE_GAS = 1;
  RESOURCE_ENVIRONMENTAL_PHASE_DISSOLVED = 2;
  RESOURCE_ENVIRONMENTAL_PHASE_BOUNDARY = 3;
  RESOURCE_ENVIRONMENTAL_PHASE_PARTICULATE = 4;
}

enum ResourceFlowKind {
  RESOURCE_FLOW_KIND_UNSPECIFIED = 0;
  RESOURCE_FLOW_KIND_ENVIRONMENTAL_SOURCE = 1;
  RESOURCE_FLOW_KIND_ENVIRONMENTAL_SINK = 2;
  RESOURCE_FLOW_KIND_NEIGHBOR_EXCHANGE_IN = 3;
  RESOURCE_FLOW_KIND_NEIGHBOR_EXCHANGE_OUT = 4;
  RESOURCE_FLOW_KIND_ORGANISM_UPTAKE = 5;
  RESOURCE_FLOW_KIND_ORGANISM_RELEASE = 6;
}

enum ResourceFlowProcess {
  RESOURCE_FLOW_PROCESS_UNSPECIFIED = 0;
  RESOURCE_FLOW_PROCESS_EXTERNAL_ENERGY_CAPTURE = 1;
  RESOURCE_FLOW_PROCESS_PARTICULATE_DIGESTION = 2;
  RESOURCE_FLOW_PROCESS_ENVIRONMENTAL_GAS_SOURCE = 3;
  RESOURCE_FLOW_PROCESS_ENVIRONMENTAL_GAS_SINK = 4;
  RESOURCE_FLOW_PROCESS_ENVIRONMENTAL_GAS_EXCHANGE = 5;
  RESOURCE_FLOW_PROCESS_MANDATORY_MAINTENANCE = 6;
  RESOURCE_FLOW_PROCESS_BIOMASS_ASSEMBLY = 7;
  RESOURCE_FLOW_PROCESS_MICRONUTRIENT_UPTAKE = 8;
}

message JourneyDeathCauseProbability {
  uint32 cause = 1;
  uint32 probability_q = 2;
  bool triggered = 3;
}

message OrganismJourneyEvent {
  uint64 event_id = 1;
  uint64 tick = 2;
  uint32 phase = 3;
  OrganismJourneyEventFamily family = 4;
  uint64 subject_organism_id = 5;
  uint64 subject_species_id = 6;
  uint32 tile_id = 7;
  uint32 position_x_q = 8;
  uint32 position_y_q = 9;
  uint64 related_organism_id = 10;
  uint64 related_remnant_id = 11;
  uint32 resource_id = 12;
  sint64 amount_q = 13;
  uint32 detail_id = 14;
  repeated JourneyDeathCauseProbability death_cause_probabilities = 15;
}

message RoutineResourceAcquisition {
  uint32 resource_id = 1;
  sint64 amount_q = 2;
}

message OrganismRoutineActivitySummary {
  uint64 bucket_start_hour = 1;
  uint32 period_hours = 2;
  uint64 subject_organism_id = 3;
  uint64 subject_species_id = 4;
  uint32 tile_id = 5;
  repeated RoutineResourceAcquisition resource_acquisitions = 6;
}

message ExactResourceStock {
  uint32 resource_id = 1;
  sint64 quantity_q = 2;
}

message ResourceDefinition {
  uint32 resource_id = 1;
  string stable_key = 2;
  string display_name = 3;
  ResourceBiologicalForm biological_form = 4;
  ResourceEnvironmentalPhase environmental_phase = 5;
}

message ReactionDefinition {
  uint32 reaction_id = 1;
  string stable_key = 2;
  string display_name = 3;
}

message ResourceFlow {
  uint32 resource_id = 1;
  ResourceFlowKind kind = 2;
  sint64 amount_q = 3;
}

message ResourceFlowHistoryInterval {
  uint64 completed_tick = 1;
  uint64 end_simulated_hour = 2;
  uint32 period_hours = 3;
  repeated ResourceFlow resource_flows = 4;
}

message ResourceFlowContributor {
  uint32 resource_id = 1;
  ResourceFlowKind kind = 2;
  ResourceFlowProcess process = 3;
  uint32 reaction_id = 4;
  uint64 species_id = 5;
  sint64 amount_q = 6;
}

message ResourceAcquisitionEvidence {
  uint32 resource_id = 1;
  sint64 requested_q = 2;
  sint64 granted_q = 3;
  bool tile_supply_constrained = 4;
  bool claim_contention_constrained = 5;
}

enum AcquisitionProcess {
  ACQUISITION_PROCESS_UNSPECIFIED = 0;
  ACQUISITION_PROCESS_EXTERNAL_ENERGY_CAPTURE = 1;
  ACQUISITION_PROCESS_SCAVENGING = 2;
}

enum AcquisitionGateReason {
  ACQUISITION_GATE_REASON_UNSPECIFIED = 0;
  ACQUISITION_GATE_REASON_MISSING_CAPABILITY = 1;
  ACQUISITION_GATE_REASON_INACCESSIBLE_LIGHT = 2;
  ACQUISITION_GATE_REASON_ENVIRONMENTAL_OPPORTUNITY = 3;
  ACQUISITION_GATE_REASON_INTERNAL_CAPACITY = 4;
  ACQUISITION_GATE_REASON_COOLDOWN_ACTIVE = 5;
  ACQUISITION_GATE_REASON_INSUFFICIENT_ACTION_ENERGY = 6;
}

message AcquisitionGateEvidence {
  AcquisitionProcess process = 1;
  AcquisitionGateReason reason = 2;
  sint64 available_q = 3;
  sint64 required_q = 4;
  uint64 clears_at_tick = 5;
}

enum OrganismActionProcess {
  ORGANISM_ACTION_PROCESS_UNSPECIFIED = 0;
  ORGANISM_ACTION_PROCESS_BIOMASS_GROWTH = 1;
  ORGANISM_ACTION_PROCESS_REPRODUCTION = 2;
}

enum OrganismActionGateReason {
  ORGANISM_ACTION_GATE_REASON_UNSPECIFIED = 0;
  ORGANISM_ACTION_GATE_REASON_MISSING_CAPABILITY = 1;
  ORGANISM_ACTION_GATE_REASON_BEHAVIOR_SUPPRESSED = 2;
  ORGANISM_ACTION_GATE_REASON_COOLDOWN_ACTIVE = 3;
  ORGANISM_ACTION_GATE_REASON_HEALTH_BELOW_MINIMUM = 4;
  ORGANISM_ACTION_GATE_REASON_STRUCTURE_BELOW_MINIMUM = 5;
  ORGANISM_ACTION_GATE_REASON_RESERVE_BELOW_MINIMUM = 6;
  ORGANISM_ACTION_GATE_REASON_CONSTITUTIVE_MICRONUTRIENT_QUOTA_MISSING = 7;
  ORGANISM_ACTION_GATE_REASON_OFFSPRING_MICRONUTRIENT_QUOTA_MISSING = 8;
  ORGANISM_ACTION_GATE_REASON_MAINTENANCE_SHORTFALL = 9;
  ORGANISM_ACTION_GATE_REASON_RESERVE_PROTECTION_FLOOR = 10;
  ORGANISM_ACTION_GATE_REASON_INTERNAL_CAPACITY = 11;
  ORGANISM_ACTION_GATE_REASON_RESOURCE_SUPPLY = 12;
  ORGANISM_ACTION_GATE_REASON_CLAIM_CONTENTION = 13;
  ORGANISM_ACTION_GATE_REASON_LIFECYCLE_INELIGIBLE = 14;
}

message OrganismActionGateEvidence {
  OrganismActionProcess process = 1;
  OrganismActionGateReason reason = 2;
  sint64 available_q = 3;
  sint64 required_q = 4;
  uint32 resource_id = 5;
  uint64 clears_at_tick = 6;
}

message OrganismProjection {
  uint64 organism_id = 1;
  uint64 species_id = 2;
  uint32 position_x_q = 3;
  uint32 position_y_q = 4;
  sint64 velocity_x_q_per_hour = 5;
  sint64 velocity_y_q_per_hour = 6;
  uint64 birth_tick = 7;
  uint64 biological_age_hours = 8;
  OrganismLifecyclePhase lifecycle_phase = 9;
  sint64 structural_matter_q = 10;
  sint64 charged_reserve_q = 11;
  sint64 charged_reserve_capacity_q = 12;
  uint32 relative_health_q = 13;
  uint32 reserve_factor_q = 14;
  uint32 structure_factor_q = 15;
  uint32 age_factor_q = 16;
  uint32 environmental_factor_q = 17;
  uint64 reproduction_not_before_tick = 18;
  uint64 successful_reproduction_count = 19;
  uint64 scavenge_not_before_tick = 20;
  sint64 ingested_structural_matter_q = 21;
  uint32 body_radius_q = 22;
  OrganismBehavior behavior = 23;
  BehaviorTargetKind behavior_target_kind = 24;
  uint64 behavior_target_id = 25;
  uint32 behavior_target_position_x_q = 26;
  uint32 behavior_target_position_y_q = 27;
  uint64 behavior_selected_at_tick = 28;
  uint64 behavior_minimum_dwell_until_tick = 29;
  uint32 recent_energy_coverage_q = 30;
  uint32 recent_acquisition_coverage_q = 31;
  uint32 limiting_material_deficit_q = 32;
  uint32 resource_pressure_q = 33;
  repeated ExactResourceStock committed_micronutrients = 34;
  repeated ExactResourceStock free_micronutrients = 35;
  repeated ResourceAcquisitionEvidence resource_acquisition_evidence = 36;
  repeated AcquisitionGateEvidence acquisition_gate_evidence = 37;
  repeated OrganismActionGateEvidence action_gate_evidence = 38;
}

message BehaviorCount {
  OrganismBehavior behavior = 1;
  uint64 count = 2;
}

message BehaviorDistribution {
  uint64 species_id = 1;
  uint64 observed_at_tick = 2;
  uint64 total_observed_organisms = 3;
  repeated BehaviorCount counts = 4;
}

message RemnantProjection {
  uint64 remnant_id = 1;
  uint64 source_organism_id = 2;
  uint64 source_species_id = 3;
  uint32 position_x_q = 4;
  uint32 position_y_q = 5;
  uint64 created_tick = 6;
  sint64 structural_matter_q = 7;
  sint64 charged_reserve_q = 8;
  uint32 body_radius_q = 9;
  repeated ExactResourceStock micronutrients = 10;
}

message UnknownTile {}

message ReducedTile {
  sint32 elevation_meters = 1;
  uint64 observed_at_tick = 2;
  repeated uint32 known_present_resource_ids = 3;
}

message LiveTile {
  sint32 elevation_meters = 1;
  uint64 observed_at_tick = 2;
  repeated ExactResourceStock resource_stocks = 3;
  repeated OrganismProjection organisms = 4;
  repeated RemnantProjection remnants = 5;
  repeated BehaviorDistribution behavior_distributions = 6;
  uint32 resource_flow_period_hours = 7;
  repeated ResourceFlow resource_flows = 8;
  repeated ResourceFlowHistoryInterval resource_flow_history = 9;
  repeated ResourceFlowContributor resource_flow_contributors = 10;
}

message TileProjection {
  uint32 tile_id = 1;
  sint32 x = 2;
  sint32 y = 3;

  oneof detail {
    UnknownTile unknown = 10;
    ReducedTile reduced = 11;
    LiveTile live = 12;
  }
}

message SpeciesProjection {
  uint64 species_id = 1;
  SpeciesPopulationScope population_scope = 2;
  uint64 population = 3;
  repeated BehaviorCount behavior_counts = 4;
  SpeciesEvolution evolution = 5;
}

message SpeciesEvolution {
  uint64 genome_id = 1;
  uint32 founder_genome_id = 14;
  uint32 founder_allocation_id = 15;
  string genome_hash = 2;
  repeated uint32 acquired_trait_ids = 3;
  uint64 mutation_balance_q = 4;
  uint64 evolution_revision = 5;
  uint64 speciation_not_before_tick = 6;
  uint32 average_health_q = 7;
  uint64 last_mutation_income_q = 8;
  uint32 mutation_income_modifier_q = 9;
  uint64 parent_species_id = 10;
  uint64 created_tick = 11;
  bool extinct = 12;
  uint64 extinct_tick = 13;
}

message AbiogenesisRoot {
  uint64 species_id = 1;
  uint32 founder_genome_id = 2;
  uint32 starting_tile_id = 3;
  uint32 initial_population = 4;
  bool player_selected = 5;
  uint32 founder_allocation_id = 6;
}

message GameProjection {
  GameMode mode = 1;
  GameRunStatus run_status = 2;
  GameLossReason loss_reason = 3;
  uint64 controlled_species_id = 4;
  uint64 gameplay_revision = 5;
  bool ended = 6;
  uint64 ended_tick = 7;
  repeated AbiogenesisRoot roots = 8;
  repeated uint64 mutation_locked_species_ids = 9;
}

message ActorWorldProjection {
  uint64 world_id = 1;
  uint64 completed_tick = 2;
  uint64 world_revision = 3;
  uint64 simulated_hours = 4;
  uint32 tick_duration_hours = 5;
  WorldLifecycle lifecycle = 6;
  string world_rules_hash = 7;
  uint32 width = 8;
  uint32 height = 9;
  bool wrap_x = 10;
  bool wrap_y = 11;
  uint64 controlled_species_id = 12;
  repeated TileProjection tiles = 13;
  repeated SpeciesProjection species = 14;
  GameProjection gameplay = 15;
  repeated OrganismJourneyEvent journey_events = 16;
  repeated OrganismRoutineActivitySummary routine_activity_summaries = 17;
  repeated OrganismJourneyEvent activity_pulse_events = 18;
  repeated ResourceDefinition resource_definitions = 19;
  repeated ReactionDefinition reaction_definitions = 20;
  repeated LineageReviewLandmark lineage_review_landmarks = 21;
  repeated NotableEvent notable_events = 22;
  repeated AttentionAlert attention_alerts = 23;
}

message ProjectionSnapshot {
  uint64 projection_stream_id = 1;
  uint64 stream_revision = 2;
  ActorWorldProjection projection = 3;
}

message ProjectionBatch {
  uint64 projection_stream_id = 1;
  uint64 world_id = 2;
  string world_rules_hash = 3;
  uint64 base_stream_revision = 4;
  uint64 target_stream_revision = 5;
  uint64 from_exclusive_tick = 6;
  uint64 through_completed_tick = 7;
  uint64 world_revision = 8;
  uint64 simulated_hours = 9;
  WorldLifecycle lifecycle = 10;
  repeated TileProjection tile_replacements = 11;
  repeated uint32 removed_tile_ids = 12;
  repeated SpeciesProjection species_replacements = 13;
  repeated uint64 removed_species_ids = 14;
  GameProjection gameplay = 15;
  repeated OrganismJourneyEvent journey_event_appends = 16;
  repeated OrganismRoutineActivitySummary routine_activity_summaries = 17;
  repeated OrganismJourneyEvent activity_pulse_events = 18;
  repeated LineageReviewLandmark lineage_review_landmark_appends = 19;
  repeated NotableEvent notable_event_appends = 20;
  repeated AttentionAlert attention_alert_appends = 21;
}
